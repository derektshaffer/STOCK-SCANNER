name: Historical Scanner Path Target Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "path_target_validation.py"
      - ".github/workflows/path-target-bootstrap.yml"

permissions:
  contents: write
  actions: read

concurrency:
  # Deliberately shares the Scanner historical replay lock so a targeted path
  # bootstrap replaces an unnecessary all-purpose backfill on the same branch.
  group: historical-ml-backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  path-bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Run path target bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run leakage-aware Scanner replay
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE_FEED: ${{ secrets.ALPACA_LIVE_FEED }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          REPLAY_TRADING_DAYS: "20"
          REPLAY_UNIVERSE_SIZE: "300"
          REPLAY_CANDIDATES_PER_SCAN: "20"
          REPLAY_SCAN_STEP_MINUTES: "10"
        run: python historical_scanner_replay.py

      - name: Validate endpoint versus path target
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install --disable-pip-version-check -q "xgboost>=2.1" "numpy>=1.26"
          python path_target_validation.py
          python validation_status.py

      - name: Run learning regressions
        env:
          GITHUB_REPOSITORY: example/repo
          GH_TOKEN: synthetic-token
          TRADIER_TOKEN: synthetic-token
        run: python learning_system_regression_check.py

      - name: Commit path bootstrap evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outcome_reports/outcomes_historical_replay.json
          git add outcome_reports/path_target_ml_validation.json
          git add validation_status/latest.json validation_status/latest.md
          if git diff --cached --quiet; then
            echo "Path-target bootstrap evidence is unchanged."
          else
            git commit -m "Add path-aware historical Scanner evidence"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preserve path bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-path-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outcome_reports/outcomes_historical_replay.json
            outcome_reports/path_target_ml_validation.json
            validation_status/latest.json
            validation_status/latest.md
          if-no-files-found: warn
          retention-days: 90
