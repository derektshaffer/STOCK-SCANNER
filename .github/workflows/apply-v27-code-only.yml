name: Apply v2.7 code only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v27-code-only.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and push Python changes
        shell: bash
        run: |
          python - <<'PY'
          import base64, re, zlib
          from pathlib import Path
          text = Path('.github/workflows/stock-scanner.yml').read_text()
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', text)
          if not match:
              raise SystemExit('v2.7 payload not found')
          Path('/tmp/v27.patch').write_bytes(zlib.decompress(base64.b64decode(match.group(1))))
          PY
          git apply --check /tmp/v27.patch
          git apply /tmp/v27.patch
          python -m py_compile stock_scanner.py scanner_app.py
          git config user.name "ChatGPT Scanner Updater"
          git config user.email "actions@users.noreply.github.com"
          git add stock_scanner.py scanner_app.py
          git commit -m "Update momentum scanner to v2.7 TOD volume [skip ci]"
          git push origin HEAD:main
