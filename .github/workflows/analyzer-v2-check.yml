name: Analyzer v2 validation

on:
  push:
    branches: [main]
    paths:
      - "analyzer_v2_integration.py"
      - "analyzer_v2_ui.py"
      - "prediction_tracker.py"
      - "score_analyzer_outcomes.py"
      - "analyzer_bootstrap.py"
      - "analyzer_ui_core.py"
      - "ml_ui.py"
      - "historical_ui.py"
      - "historical_integration.py"
      - "historical_patterns.py"
      - "ml_predictor.py"
      - "multi_bounce.py"
      - "stair_step.py"
      - "trading_research_agent.py"
      - ".github/workflows/trading-research.yml"
      - "ml_integration.py"
      - "peer_ml_predictor.py"
      - "analyzer_app.py"
      - "app.py"
      - "alpaca_live_stream.py"
      - "live_tape_ui.py"
      - "float_data.py"
      - "stock_analyzer.py"
      - "stock_scanner.py"
      - "scanner_discovery.py"
      - "scanner_app.py"
      - "scanner_expand.py"
      - "scanner_single_open.py"
      - "glass_theme.py"
      - "scanner_ml_ranker.py"
      - "scanner_behavior.py"
      - "historical_scanner_replay.py"
      - "historical_timeframe_replay.py"
      - "timeframe_ml_ranker.py"
      - "timeframe_targets.py"
      - "market_regime.py"
      - "score_outcomes.py"
      - "tradier_live.py"
      - "position_exit.py"
      - "consistency_regression_check.py"
      - ".github/workflows/stock-scanner.yml"
      - ".github/workflows/outcome-tracker.yml"
      - ".github/workflows/historical-ml-backfill.yml"
      - "requirements.txt"
      - "APP_BOUNDARY.md"
      - "app_boundary_check.py"
      - "tradier_live_stream.py"
      - "live_market_stream.py"
      - ".github/workflows/analyzer-v2-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Analyzer v2
        run: |
          python -m py_compile analyzer_v2_integration.py analyzer_v2_ui.py prediction_tracker.py score_analyzer_outcomes.py analyzer_bootstrap.py analyzer_ui_core.py ml_ui.py historical_ui.py historical_integration.py historical_patterns.py ml_predictor.py multi_bounce.py stair_step.py trading_research_agent.py ml_integration.py peer_ml_predictor.py analyzer_app.py app.py glass_theme.py scanner_app.py scanner_expand.py scanner_single_open.py alpaca_live_stream.py tradier_live_stream.py live_market_stream.py live_tape_ui.py float_data.py stock_analyzer.py stock_scanner.py scanner_discovery.py scanner_ml_ranker.py scanner_behavior.py historical_scanner_replay.py historical_timeframe_replay.py timeframe_ml_ranker.py timeframe_targets.py market_regime.py score_outcomes.py tradier_live.py position_exit.py consistency_regression_check.py
      - name: Import standalone v2 modules
        run: |
          python - <<'PY'
          import analyzer_v2_integration
          import analyzer_v2_ui
          import prediction_tracker
          import ml_predictor
          import ml_integration
          import peer_ml_predictor
          import scanner_behavior
          import tradier_live_stream
          import live_market_stream
          print("Analyzer v2 imports passed")
          PY
      - name: Smoke-test similar-ticker peer ML
        run: |
          python -m pip install --disable-pip-version-check -q "xgboost>=2.1" "numpy>=1.26"
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from peer_ml_predictor import predict_peer_ml

          metrics = {
              "price": 8.0,
              "day_high": 9.0,
              "day_low": 6.8,
              "day_pct": 18.0,
              "score": 72.0,
              "momentum_5m": 1.4,
              "momentum_15m": 3.2,
              "volume_pace": 3.0,
              "from_high_pct": 11.1,
              "vwap_extension_pct": 4.0,
              "liquidity": {"avg_dollar_volume": 18_000_000},
          }
          result = predict_peer_ml(
              "PEERTEST",
              datetime.now(timezone.utc),
              metrics,
              ZoneInfo("America/New_York"),
          )
          print("PEER_STATUS=" + str(result.get("status")))
          print("PEER_VALIDATED=" + str(bool(result.get("validated"))).lower())
          print("PEER_SAMPLES=" + str(result.get("samples", 0)))
          print("PEER_SYMBOLS=" + str(result.get("peer_symbols", 0)))
          print("PEER_PROBABILITY=" + str(result.get("probability_pct")))
          print("PEER_EDGE=" + str(result.get("peer_edge_score")))
          assert int(result.get("source_observations") or 0) >= 1000
          assert int(result.get("samples") or 0) > 0
          PY
      - name: Smoke-test scanner outcome provider fallback
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TRADIER_TOKEN: "smoke-test-token"
        run: |
          python - <<'PY'
          from datetime import date, datetime, time
          from zoneinfo import ZoneInfo
          import score_outcomes as so

          et = ZoneInfo("America/New_York")
          start = datetime.combine(date(2026, 8, 27), time(9, 30), tzinfo=et)
          end = datetime.combine(date(2026, 8, 27), time(16, 1), tzinfo=et)

          def fake_timesales(symbol, token, start_utc, end_utc, interval="1min", session_filter="open"):
              assert token == "smoke-test-token"
              assert interval == "1min"
              assert session_filter == "open"
              return [
                  {"t": "2026-08-27T14:30:00Z", "c": 10.0, "v": 1000},
                  {"t": "2026-08-27T14:45:00Z", "c": 10.4, "v": 1000},
                  {"t": "2026-08-27T15:00:00Z", "c": 10.7, "v": 1000},
                  {"t": "2026-08-27T15:30:00Z", "c": 11.0, "v": 1000},
              ]

          so.get_tradier_timesales_bars = fake_timesales
          so.ALPACA_CONFIGURED = False
          bars, source = so.get_outcome_bars({"TEST"}, start, end)
          assert source == "tradier_1min_open"
          assert len(bars.get("TEST") or []) == 4
          print("OUTCOME_PROVIDER_SMOKE=passed")
          PY
      - name: Smoke-test Tradier-only durable scanner logging
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Run live-learning pipeline smoke')
        env:
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          SCANNER_TRADIER_DISCOVERY: "1"
          SCANNER_DISCOVERY_UNIVERSE_SIZE: "300"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf scan_logs scan_cache
          python stock_scanner.py
          test -n "$(find scan_logs -name 'scan_*.json' -print -quit)"
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("scan_logs").glob("scan_*.json"))
          assert paths, "No durable scan JSON was written"
          payload = json.loads(paths[-1].read_text(encoding="utf-8"))
          assert (payload.get("data") or {}).get("live_provider") == "tradier"
          assert int((payload.get("summary") or {}).get("candidates_logged") or 0) > 0
          print("TRADIER_ONLY_SCAN_SMOKE=passed")
          print("SCAN_MODE=" + str(payload.get("mode")))
          print("CANDIDATES_LOGGED=" + str((payload.get("summary") or {}).get("candidates_logged")))
          PY
      - name: Validate corrected scanner ML replay model
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Run scanner ML pipeline validation')
        run: |
          python - <<'PY'
          import scanner_ml_ranker as sm

          rows, source = sm.load_training_observations()
          _model, meta = sm._validation_and_model(rows)
          print("SCANNER_ML_STATUS=" + str(meta.get("status")))
          print("SCANNER_HISTORICAL_VALIDATED=" + str(bool(meta.get("historical_validated"))).lower())
          print("SCANNER_FULLY_VALIDATED=" + str(bool(meta.get("validated"))).lower())
          print("SCANNER_WF_AUC=" + str(meta.get("walk_forward_auc")))
          print("SCANNER_WF_BRIER=" + str(meta.get("walk_forward_brier")))
          print("SCANNER_BASELINE_BRIER=" + str(meta.get("baseline_brier")))
          print("SCANNER_VALIDATION_SAMPLES=" + str(meta.get("validation_samples")))
          print("SCANNER_LIVE_CONFIRMATION_SAMPLES=" + str(meta.get("live_confirmation_samples")))
          assert bool(meta.get("historical_validated")), meta
          assert meta.get("validation_split_unit") == "trading_day", meta
          PY
      - name: Enforce standalone Scanner / Analyzer boundary
        run: python app_boundary_check.py
      - name: Run provider/version consistency regressions
        run: python consistency_regression_check.py
      # Re-run marker for secret verification
      - name: Report Tradier secret availability
        env:
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: |
          if [ -n "$TRADIER_ACCESS_TOKEN" ] || [ -n "$TRADIER_TOKEN" ]; then
            echo "TRADIER_SECRET_CONFIGURED=true"
          else
            echo "TRADIER_SECRET_CONFIGURED=false"
          fi
