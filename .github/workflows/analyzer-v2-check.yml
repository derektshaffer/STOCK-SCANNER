name: Analyzer v2 validation

on:
  push:
    branches: [main]
    paths:
      - "analyzer_v2_integration.py"
      - "analyzer_v2_ui.py"
      - "prediction_tracker.py"
      - "analyzer_shadow_sampler.py"
      - "strategy_thesis.py"
      - "analyzer_runtime_context.py"
      - "timeframe_thesis.py"
      - "score_analyzer_outcomes.py"
      - "analyzer_bootstrap.py"
      - "analyzer_ui_core.py"
      - "analyzer_visuals.py"
      - "ml_ui.py"
      - "historical_ui.py"
      - "historical_integration.py"
      - "analyzer_history_cache.py"
      - "analyzer_context_cache.py"
      - "historical_patterns.py"
      - "ml_predictor.py"
      - "multi_bounce.py"
      - "stair_step.py"
      - "trading_research_agent.py"
      - ".github/workflows/trading-research.yml"
      - "ml_integration.py"
      - "peer_ml_predictor.py"
      - "analyzer_app.py"
      - "analyzer_app_fixed.py"
      - "app.py"
      - "alpaca_live_stream.py"
      - "live_tape_ui.py"
      - "float_data.py"
      - "stock_analyzer.py"
      - "stock_scanner.py"
      - "scanner_discovery.py"
      - "scanner_app.py"
      - "scanner_expand.py"
      - "scanner_single_open.py"
      - "glass_theme.py"
      - "scanner_ml_ranker.py"
      - "scanner_behavior.py"
      - "scanner_timeframe_fit.py"
      - "scanner_runtime.py"
      - "momentum_alerts.py"
      - "offhours_timeframe_scan.py"
      - "offhours_outcome_tracker.py"
      - "offhours_outcome_regression_check.py"
      - ".github/workflows/offhours-timeframe-scan.yml"
      - "historical_scanner_replay.py"
      - "historical_listing_universe.py"
      - ".github/workflows/historical-listing-universe.yml"
      - "universe_snapshot.py"
      - "validation_status.py"
      - ".github/workflows/universe-snapshot.yml"
      - "historical_hypothesis_challenge.py"
      - "historical_hypothesis_regression_check.py"
      - "historical_timeframe_replay.py"
      - "timeframe_ml_ranker.py"
      - "timeframe_targets.py"
      - "market_regime.py"
      - "swing_feature_research.py"
      - "swing_research_flags.py"
      - "score_outcomes.py"
      - "tradier_live.py"
      - "position_exit.py"
      - "consistency_regression_check.py"
      - ".github/workflows/stock-scanner.yml"
      - ".github/workflows/outcome-tracker.yml"
      - ".github/workflows/historical-ml-backfill.yml"
      - "requirements.txt"
      - "APP_BOUNDARY.md"
      - "app_boundary_check.py"
      - "tradier_live_stream.py"
      - "live_market_stream.py"
      - ".github/workflows/analyzer-v2-check.yml"
  # Integrity-first gate: validate proposed code before it can reach main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Analyzer v2
        run: |
          python -m py_compile analyzer_v2_integration.py analyzer_v2_ui.py prediction_tracker.py analyzer_shadow_sampler.py analyzer_runtime_context.py strategy_thesis.py timeframe_thesis.py score_analyzer_outcomes.py analyzer_bootstrap.py analyzer_ui_core.py analyzer_visuals.py ml_ui.py historical_ui.py historical_integration.py analyzer_history_cache.py analyzer_context_cache.py historical_patterns.py ml_predictor.py multi_bounce.py stair_step.py trading_research_agent.py ml_integration.py peer_ml_predictor.py analyzer_app.py analyzer_app_fixed.py app.py glass_theme.py scanner_app.py scanner_expand.py scanner_single_open.py alpaca_live_stream.py tradier_live_stream.py live_market_stream.py live_tape_ui.py float_data.py stock_analyzer.py stock_scanner.py scanner_discovery.py scanner_ml_ranker.py scanner_behavior.py scanner_timeframe_fit.py scanner_runtime.py momentum_alerts.py offhours_timeframe_scan.py offhours_outcome_tracker.py historical_scanner_replay.py historical_listing_universe.py universe_snapshot.py validation_status.py historical_hypothesis_challenge.py historical_hypothesis_regression_check.py historical_timeframe_replay.py timeframe_ml_ranker.py timeframe_targets.py market_regime.py swing_feature_research.py swing_research_flags.py offhours_outcome_regression_check.py score_outcomes.py score_opportunity_outcomes.py learning_system_audit.py learning_system_regression_check.py tradier_live.py position_exit.py consistency_regression_check.py
      - name: Import standalone v2 modules
        run: |
          python - <<'PY'
          import analyzer_v2_integration
          import analyzer_v2_ui
          import prediction_tracker
          import analyzer_runtime_context
          import analyzer_history_cache
          import analyzer_context_cache
          import strategy_thesis
          import timeframe_thesis
          import ml_predictor
          import ml_integration
          import peer_ml_predictor
          import scanner_behavior
          import tradier_live_stream
          import live_market_stream
          print("Analyzer v2 imports passed")
          PY
      - name: Smoke-test similar-ticker peer ML
        run: |
          python -m pip install --disable-pip-version-check -q "xgboost>=2.1" "numpy>=1.26"
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from peer_ml_predictor import predict_peer_ml

          metrics = {
              "price": 8.0,
              "day_high": 9.0,
              "day_low": 6.8,
              "day_pct": 18.0,
              "score": 72.0,
              "momentum_5m": 1.4,
              "momentum_15m": 3.2,
              "volume_pace": 3.0,
              "from_high_pct": 11.1,
              "vwap_extension_pct": 4.0,
              "liquidity": {"avg_dollar_volume": 18_000_000},
          }
          result = predict_peer_ml(
              "PEERTEST",
              datetime.now(timezone.utc),
              metrics,
              ZoneInfo("America/New_York"),
          )
          print("PEER_STATUS=" + str(result.get("status")))
          print("PEER_VALIDATED=" + str(bool(result.get("validated"))).lower())
          print("PEER_SAMPLES=" + str(result.get("samples", 0)))
          print("PEER_SYMBOLS=" + str(result.get("peer_symbols", 0)))
          print("PEER_PROBABILITY=" + str(result.get("probability_pct")))
          print("PEER_EDGE=" + str(result.get("peer_edge_score")))
          print("PEER_BEHAVIOR_VERSION=" + str(result.get("behavior_feature_version")))
          print("PEER_SOURCE_BEFORE_VERSION_FILTER=" + str(result.get("source_observations_before_behavior_filter", 0)))
          compatible = int(result.get("source_observations") or 0)
          before_filter = int(result.get("source_observations_before_behavior_filter") or 0)
          if compatible == 0:
              # Safe transition after a behavior-feature version bump: old
              # bounce semantics must not be silently mixed with the new model.
              assert before_filter >= 1000
              assert result.get("status") == "collecting"
              assert result.get("behavior_feature_version") == "scanner-behavior-v7-confirmed-multisession"
          else:
              assert int(result.get("samples") or 0) > 0
          PY
      - name: Smoke-test scanner outcome provider fallback
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TRADIER_TOKEN: "smoke-test-token"
        run: |
          python - <<'PY'
          from datetime import date, datetime, time
          from zoneinfo import ZoneInfo
          import score_outcomes as so

          et = ZoneInfo("America/New_York")
          start = datetime.combine(date(2026, 8, 27), time(9, 30), tzinfo=et)
          end = datetime.combine(date(2026, 8, 27), time(16, 1), tzinfo=et)

          def fake_timesales(symbol, token, start_utc, end_utc, interval="1min", session_filter="open"):
              assert token == "smoke-test-token"
              assert interval == "1min"
              assert session_filter == "open"
              return [
                  {"t": "2026-08-27T14:30:00Z", "c": 10.0, "v": 1000},
                  {"t": "2026-08-27T14:45:00Z", "c": 10.4, "v": 1000},
                  {"t": "2026-08-27T15:00:00Z", "c": 10.7, "v": 1000},
                  {"t": "2026-08-27T15:30:00Z", "c": 11.0, "v": 1000},
              ]

          so.get_tradier_timesales_bars = fake_timesales
          so.ALPACA_CONFIGURED = False
          bars, source = so.get_outcome_bars({"TEST"}, start, end)
          assert source == "tradier_1min_open"
          assert len(bars.get("TEST") or []) == 4
          print("OUTCOME_PROVIDER_SMOKE=passed")
          PY
      - name: Smoke-test Analyzer Tradier outcome provider
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import score_analyzer_outcomes as sao

          sao.TRADIER_TOKEN = "smoke-token"
          sao.API_KEY = ""
          sao.API_SECRET = ""

          def fake_timesales(symbol, token, start, end, interval="1min", session_filter="open"):
              assert symbol == "TEST"
              assert token == "smoke-token"
              assert interval == "1min"
              assert session_filter == "open"
              return [
                  {"t": "2026-08-27T14:30:00Z", "o": 10.0, "h": 10.2, "l": 9.9, "c": 10.1, "v": 1000},
                  {"t": "2026-08-27T14:31:00Z", "o": 10.1, "h": 10.4, "l": 10.0, "c": 10.3, "v": 1200},
              ]

          def fake_history(symbol, token, start, end, interval="daily"):
              assert symbol == "TEST"
              assert token == "smoke-token"
              assert interval == "daily"
              return [
                  {"t": "2026-08-27T20:00:00Z", "o": 10.0, "h": 10.5, "l": 9.8, "c": 10.3, "v": 100000},
              ]

          sao.get_timesales_bars = fake_timesales
          sao.get_history_bars = fake_history
          start = datetime(2026, 8, 27, 13, 30, tzinfo=timezone.utc)
          end = datetime(2026, 8, 27, 20, 1, tzinfo=timezone.utc)

          intraday = sao._fetch_symbol_bars("TEST", start, end)
          daily = sao._fetch_daily_bars({"TEST"}, start, end)
          assert len(intraday) == 2, intraday
          assert len(daily.get("TEST") or []) == 1, daily
          print("ANALYZER_TRADIER_OUTCOME_SMOKE=passed")
          PY

      # Manual/live integrity smoke: this step intentionally uses repository Tradier secrets.
      - name: Smoke-test Tradier-only durable scanner logging
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Run live-learning pipeline smoke')
        env:
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          SCANNER_TRADIER_DISCOVERY: "1"
          SCANNER_DISCOVERY_UNIVERSE_SIZE: "300"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf scan_logs scan_cache
          python stock_scanner.py
          test -n "$(find scan_logs -name 'scan_*.json' -print -quit)"
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("scan_logs").glob("scan_*.json"))
          assert paths, "No durable scan JSON was written"
          payload = json.loads(paths[-1].read_text(encoding="utf-8"))
          assert (payload.get("data") or {}).get("live_provider") == "tradier"
          assert int((payload.get("summary") or {}).get("candidates_logged") or 0) > 0
          print("TRADIER_ONLY_SCAN_SMOKE=passed")
          print("SCAN_MODE=" + str(payload.get("mode")))
          print("CANDIDATES_LOGGED=" + str((payload.get("summary") or {}).get("candidates_logged")))
          PY
      - name: Validate corrected scanner ML replay model
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Run scanner ML pipeline validation')
        run: |
          python - <<'PY'
          import scanner_ml_ranker as sm

          rows, source = sm.load_training_observations()
          _model, meta = sm._validation_and_model(rows)
          print("SCANNER_ML_STATUS=" + str(meta.get("status")))
          print("SCANNER_HISTORICAL_VALIDATED=" + str(bool(meta.get("historical_validated"))).lower())
          print("SCANNER_FULLY_VALIDATED=" + str(bool(meta.get("validated"))).lower())
          print("SCANNER_WF_AUC=" + str(meta.get("walk_forward_auc")))
          print("SCANNER_WF_BRIER=" + str(meta.get("walk_forward_brier")))
          print("SCANNER_BASELINE_BRIER=" + str(meta.get("baseline_brier")))
          print("SCANNER_VALIDATION_SAMPLES=" + str(meta.get("validation_samples")))
          print("SCANNER_LIVE_CONFIRMATION_SAMPLES=" + str(meta.get("live_confirmation_samples")))
          assert bool(meta.get("historical_validated")), meta
          assert meta.get("validation_split_unit") == "trading_day", meta
          PY
      - name: Render Analyzer Plotly chart smoke
        run: |
          python -m pip install --disable-pip-version-check -q "plotly>=5.24"
          python - <<'PY'
          import analyzer_visuals as av

          intraday = [
              {
                  "t": f"2026-08-31T14:{30+i:02d}:00Z",
                  "o": 10.0 + i * 0.05,
                  "h": 10.15 + i * 0.05,
                  "l": 9.90 + i * 0.05,
                  "c": 10.05 + i * 0.05,
                  "v": 1000 + i * 100,
              }
              for i in range(8)
          ]
          result = {
              "chart_data": {"intraday": intraday},
              "vwap": 10.18,
              "trade_plan": {
                  "selected": {
                      "entry_low": 10.10,
                      "entry_high": 10.20,
                      "stop": 9.85,
                      "target1": 10.55,
                      "target2": 10.80,
                      "stretch_target": 11.10,
                  }
              },
          }
          fig = av.trade_plan_plotly_figure(result)
          assert fig is not None
          payload = fig.to_plotly_json()
          traces = payload.get("data") or []
          assert any(trace.get("type") == "candlestick" for trace in traces), traces
          assert payload.get("layout", {}).get("shapes"), payload
          assert len(fig.to_json()) > 1000
          print("ANALYZER_PLOTLY_RENDER_SMOKE=passed")
          PY
      - name: Verify off-hours Swing target parity
        run: python offhours_outcome_regression_check.py
      - name: Enforce standalone Scanner / Analyzer boundary
        run: python app_boundary_check.py
      - name: Run provider/version consistency regressions
        run: python consistency_regression_check.py
      - name: Run learning objective/opportunity regressions
        run: python learning_system_regression_check.py
      - name: Run Phase 6 historical challenge regressions
        run: python historical_hypothesis_regression_check.py
      # Re-run marker for secret verification
      - name: Report Tradier secret availability
        env:
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: |
          if [ -n "$TRADIER_ACCESS_TOKEN" ] || [ -n "$TRADIER_TOKEN" ]; then
            echo "TRADIER_SECRET_CONFIGURED=true"
          else
            echo "TRADIER_SECRET_CONFIGURED=false"
          fi
