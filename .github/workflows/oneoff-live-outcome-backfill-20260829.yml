name: One-Off Live Outcome Backfill

on:
  push:
    branches:
      - experiment/live-outcome-backfill-20260829
    paths:
      - ".github/workflows/oneoff-live-outcome-backfill-20260829.yml"

permissions:
  contents: read
  actions: read

jobs:
  backfill:
    if: startsWith(github.event.head_commit.message, 'Run one-off live outcome backfill')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score recoverable live scanner days
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          OUTCOME_MARKET_PROVIDER: "tradier"
        shell: bash
        run: |
          set +e
          for d in 2026-08-24 2026-08-25 2026-08-26 2026-08-27 2026-08-28; do
            echo "===== SCORE $d ====="
            OUTCOME_DATE="$d" python score_outcomes.py
            echo "SCORE_EXIT_$d=$?"
          done
          exit 0
      - name: Validate scanner ML with recovered live reports
        run: |
          python -m pip install --disable-pip-version-check -q "xgboost>=2.1" "numpy>=1.26"
          python - <<'PY'
          import scanner_ml_ranker as sm
          rows, source = sm.load_training_observations()
          _model, meta = sm._validation_and_model(rows)
          for key in (
              "samples",
              "historical_replay_samples",
              "live_samples",
              "live_confirmation_samples",
              "live_confirmation_days",
              "live_positives",
              "live_negatives",
              "historical_validated",
              "validated",
              "status",
              "walk_forward_auc",
              "walk_forward_brier",
              "baseline_brier",
              "live_confirmation_auc",
              "live_confirmation_brier",
              "live_confirmation_baseline_brier",
              "live_confirmation_passed",
          ):
              print(f"BACKFILL_{key.upper()}={meta.get(key)}")
          print("BACKFILL_SOURCE=" + str(source))
          PY
      - name: Upload recovered outcome reports
        uses: actions/upload-artifact@v4
        with:
          name: live-outcome-backfill-result
          path: |
            outcome_reports/outcomes_2026-08-*.json
            outcome_reports/outcomes_2026-08-*.md
          if-no-files-found: warn
          retention-days: 7
