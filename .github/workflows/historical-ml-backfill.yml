name: Historical Scanner ML Backfill

# Historical replay is manual-by-default; this marker intentionally triggers the current backfill.
# Current run validates completed-bar behavior parity and Scanner ACTION quality.
# Rerun marker after completed-bar source-format validation passed.
on:
  schedule:
    # Weekly deep historical refresh. Runs in GitHub's cloud even when the
    # local Mac and Streamlit app are closed.
    - cron: "30 12 * * 6"
  workflow_dispatch:
    inputs:
      trading_days:
        description: "Trading days to replay"
        required: false
        default: "20"
        type: string
      universe_size:
        description: "Prior-information symbols per replay day"
        required: false
        default: "300"
        type: string
      candidates_per_scan:
        description: "Historical candidates kept per checkpoint"
        required: false
        default: "20"
        type: string
      scan_step_minutes:
        description: "Minutes between replay checkpoints"
        required: false
        default: "10"
        type: string
  push:
    branches: [main]
    paths:
      - "historical_scanner_replay.py"
      - "historical_timeframe_replay.py"
      - "timeframe_ml_ranker.py"
      - "timeframe_targets.py"
      - "market_regime.py"
      - "swing_feature_research.py"
      - ".github/workflows/historical-ml-backfill.yml"

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Run historical ML backfill') || contains(github.event.head_commit.message, 'Run historical timeframe backfill') || contains(github.event.head_commit.message, 'Run timeframe ML validation') || contains(github.event.head_commit.message, 'Run Swing feature research')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run leakage-aware historical replay
        if: github.event_name != 'push' || (!contains(github.event.head_commit.message, 'Run historical timeframe backfill') && !contains(github.event.head_commit.message, 'Run timeframe ML validation') && !contains(github.event.head_commit.message, 'Run Swing feature research'))
        env:
          # Alpaca values are only kept so stock_scanner's pure rule module
          # can import; the replay market data itself is Tradier-first.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE_FEED: ${{ secrets.ALPACA_LIVE_FEED }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          REPLAY_TRADING_DAYS: ${{ inputs.trading_days }}
          REPLAY_UNIVERSE_SIZE: ${{ inputs.universe_size }}
          REPLAY_CANDIDATES_PER_SCAN: ${{ inputs.candidates_per_scan }}
          REPLAY_SCAN_STEP_MINUTES: ${{ inputs.scan_step_minutes }}
          # Scheduled runs have no workflow_dispatch inputs; the replay script
          # safely falls back to its 20-day / 300-symbol defaults when blank.
        run: python historical_scanner_replay.py

      - name: Run leakage-aware timeframe replay
        if: github.event_name != 'push' || (!contains(github.event.head_commit.message, 'Run timeframe ML validation') && !contains(github.event.head_commit.message, 'Run Swing feature research'))
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_HISTORICAL_FEED: ${{ secrets.ALPACA_HISTORICAL_FEED }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # About five years of replay observations sampled weekly. The longer
          # calendar lookback also supplies the 200-day/250-day warmup features.
          TIMEFRAME_REPLAY_TRADING_DAYS: "1250"
          TIMEFRAME_REPLAY_STRIDE_DAYS: "5"
          TIMEFRAME_REPLAY_LOOKBACK_CALENDAR_DAYS: "2800"
          TIMEFRAME_REPLAY_UNIVERSE_SIZE: "250"
          TIMEFRAME_REPLAY_CANDIDATES_PER_DAY: "25"
        run: python historical_timeframe_replay.py

      - name: Validate replay dataset and ML bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install --disable-pip-version-check -q "xgboost>=2.1" "numpy>=1.26"
          python - <<'PY'
          import json
          from pathlib import Path
          import scanner_ml_ranker as sm

          path = Path("outcome_reports/outcomes_historical_replay.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          summary = payload.get("summary") or {}
          print("REPLAY_OBSERVATIONS=" + str(summary.get("observations", 0)))
          print("REPLAY_UNIQUE_SCANS=" + str(summary.get("unique_scans", 0)))
          print("REPLAY_POSITIVE_60M=" + str(summary.get("positive_3pct_60m", 0)))
          print("REPLAY_NEGATIVE_60M=" + str(summary.get("non_positive_3pct_60m", 0)))
          action = summary.get("action_benchmark") or {}
          current = action.get("current") or {}
          legacy = action.get("legacy") or {}
          changes = action.get("paired_changes") or {}
          print("ACTION_CHANGED_N=" + str(changes.get("changed_n", 0)))
          print("ACTION_BEHAVIOR_ANALYZE_NOW=" + json.dumps(current.get("analyze_now") or {}, sort_keys=True))
          print("ACTION_SIMPLE_ANALYZE_NOW=" + json.dumps(legacy.get("analyze_now") or {}, sort_keys=True))
          print("ACTION_BEHAVIOR_ANALYZE_LIFT_PP=" + str(current.get("analyze_now_quality_lift_pp")))
          print("ACTION_SIMPLE_ANALYZE_LIFT_PP=" + str(legacy.get("analyze_now_quality_lift_pp")))
          print("ACTION_DOWNGRADED_OUTCOMES=" + json.dumps(changes.get("downgraded_outcomes") or {}, sort_keys=True))
          print("ACTION_UPGRADED_OUTCOMES=" + json.dumps(changes.get("upgraded_outcomes") or {}, sort_keys=True))

          rows, source = sm.load_training_observations()
          _, meta = sm._validation_and_model(rows)
          print("ML_TOTAL_SAMPLES=" + str(meta.get("samples", 0)))
          print("ML_REPLAY_SAMPLES=" + str(meta.get("historical_replay_samples", 0)))
          print("ML_LIVE_SAMPLES=" + str(meta.get("live_samples", 0)))
          print("ML_HISTORICAL_VALIDATED=" + str(bool(meta.get("historical_validated"))).lower())
          print("ML_FULLY_VALIDATED=" + str(bool(meta.get("validated"))).lower())
          print("ML_STATUS=" + str(meta.get("status")))
          print("ML_WALK_FORWARD_AUC=" + str(meta.get("walk_forward_auc")))
          print("ML_LIVE_CONFIRMATION_AUC=" + str(meta.get("live_confirmation_auc")))

          tf_path = Path("timeframe_replay/timeframe_historical_replay.json")
          tf = json.loads(tf_path.read_text(encoding="utf-8"))
          tf_summary = tf.get("summary") or {}
          tf_replay = tf.get("replay") or {}
          print("TIMEFRAME_OBSERVATIONS=" + str(tf_summary.get("observations", 0)))
          print("TIMEFRAME_UNIQUE_SYMBOLS=" + str(tf_summary.get("unique_symbols", 0)))
          print("TIMEFRAME_REPLAY_DATES=" + str(tf_replay.get("replay_dates", 0)))
          print("TIMEFRAME_CALENDAR_YEARS=" + json.dumps(tf_replay.get("calendar_years_covered") or []))
          print("TIMEFRAME_SWING_5D_RESOLVED=" + str(tf_summary.get("swing_5d_resolved", 0)))
          print("TIMEFRAME_LONG_20D_RESOLVED=" + str(tf_summary.get("long_term_20d_resolved", 0)))
          print("TIMEFRAME_LONG_60D_RESOLVED=" + str(tf_summary.get("long_term_60d_resolved", 0)))
          print("TIMEFRAME_SEC_ENABLED=" + str(bool(((tf.get("replay") or {}).get("sec_point_in_time") or {}).get("enabled"))).lower())
          print("TIMEFRAME_SWING_LIFT=" + json.dumps(tf_summary.get("swing_5d_directional_lift") or {}, sort_keys=True))
          print("TIMEFRAME_LONG_LIFT=" + json.dumps(tf_summary.get("long_term_20d_directional_lift") or {}, sort_keys=True))
          swing_path = tf_summary.get("swing_path_target") or {}
          print("TIMEFRAME_SWING_PATH=" + json.dumps(swing_path, sort_keys=True))
          print("TIMEFRAME_SWING_PATH_LIFT=" + json.dumps(tf_summary.get("swing_path_target_lift") or {}, sort_keys=True))
          print("TIMEFRAME_MARKET_REGIMES=" + json.dumps(tf_summary.get("swing_path_by_market_regime") or {}, sort_keys=True))
          print("TIMEFRAME_CALENDAR_YEAR_RESULTS=" + json.dumps(tf_summary.get("swing_path_by_calendar_year") or {}, sort_keys=True))
          assert int(tf_summary.get("observations") or 0) >= 2500
          assert int(tf_summary.get("swing_5d_resolved") or 0) >= 2500
          assert int(swing_path.get("labeled") or 0) >= 2000
          assert int(tf_replay.get("replay_dates") or 0) >= 120
          assert len(tf_replay.get("calendar_years_covered") or []) >= 4
          PY

      - name: Validate shadow Swing timeframe ML
        run: |
          python timeframe_ml_ranker.py --output timeframe_replay/timeframe_ml_validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("timeframe_replay/timeframe_ml_validation.json").read_text(
                  encoding="utf-8"
              )
          )
          overall = report.get("overall") or {}
          print("SWING_ML_STATUS=" + str(report.get("status")))
          print("SWING_ML_HISTORICAL_VALIDATED=" + str(bool(report.get("historical_validated"))).lower())
          print("SWING_ML_SAMPLES=" + str(report.get("samples")))
          print("SWING_ML_DATES=" + str(report.get("unique_dates")))
          print("SWING_ML_YEARS=" + str(report.get("unique_years")))
          print("SWING_ML_CALENDAR_YEARS=" + json.dumps(report.get("calendar_years") or []))
          print("SWING_ML_AUC=" + str(overall.get("model_auc")))
          print("SWING_BASELINE_MODEL_AUC=" + str(overall.get("baseline_model_auc")))
          print("SWING_REGIME_MINUS_BASELINE_AUC=" + str(overall.get("regime_minus_baseline_auc")))
          print("SWING_REGIME_IMPROVED_FOLDS=" + str(overall.get("regime_features_improved_folds")))
          print("SWING_HAND_SCORE_AUC=" + str(overall.get("hand_score_auc")))
          print("SWING_ML_MINUS_HAND_AUC=" + str(overall.get("model_minus_hand_auc")))
          print("SWING_ML_MEAN_FOLD_AUC=" + str(overall.get("mean_fold_auc")))
          print("SWING_ML_BASE_TARGET_RATE_PCT=" + str(overall.get("base_target_before_stop_rate_pct")))
          print("SWING_ML_TOP_DECILE_TARGET_LIFT_PP=" + str(overall.get("top_decile_target_rate_lift_pp")))
          print("SWING_ML_SKIPPED_AMBIGUOUS=" + str(report.get("skipped_ambiguous_same_day")))
          print("SWING_ML_FOLDS_BEATING_HAND=" + str(overall.get("folds_beating_hand_score")))
          PY

      - name: Research robust Swing feature combinations
        run: |
          python swing_feature_research.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("timeframe_replay/swing_feature_research.json").read_text(
                  encoding="utf-8"
              )
          )
          summary = report.get("summary") or {}
          print("SWING_RESEARCH_STATUS=" + str(report.get("status")))
          print("SWING_RESEARCH_LABELED_ROWS=" + str(summary.get("labeled_rows")))
          print("SWING_RESEARCH_DISCOVERY_SINGLES=" + str(summary.get("discovery_qualified_singles")))
          print("SWING_RESEARCH_DISCOVERY_PAIRS=" + str(summary.get("discovery_qualified_pairs")))
          print("SWING_RESEARCH_FROZEN_TESTED=" + str(summary.get("frozen_candidates_tested")))
          print("SWING_RESEARCH_ROBUST_COUNT=" + str(summary.get("robust_research_candidates")))
          print(
              "SWING_RESEARCH_ROBUST="
              + json.dumps(
                  [
                      {
                          "setup": row.get("text"),
                          "discovery_lift_pp": (row.get("discovery") or {}).get("lift_pp"),
                          "confirmation_lift_pp": (row.get("confirmation") or {}).get("lift_pp"),
                          "confirmation_n": (row.get("confirmation") or {}).get("n"),
                          "positive_years": (row.get("year_stability") or {}).get("positive_lift_years"),
                          "eligible_years": (row.get("year_stability") or {}).get("eligible_years"),
                      }
                      for row in (report.get("robust_candidates") or [])[:10]
                  ],
                  sort_keys=True,
              )
          )
          print(
              "SWING_RESEARCH_BEST_CONFIRMATION="
              + json.dumps(
                  [
                      {
                          "setup": row.get("text"),
                          "robust": row.get("robust_research_candidate"),
                          "discovery_lift_pp": (row.get("discovery") or {}).get("lift_pp"),
                          "confirmation_lift_pp": (row.get("confirmation") or {}).get("lift_pp"),
                          "confirmation_n": (row.get("confirmation") or {}).get("n"),
                      }
                      for row in (report.get("best_confirmation_candidates") or [])[:10]
                  ],
                  sort_keys=True,
              )
          )
          assert int(summary.get("labeled_rows") or 0) >= 2500
          assert int((report.get("design") or {}).get("confirmation_samples") or 0) >= 500
          PY

      - name: Commit durable replay dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outcome_reports/outcomes_historical_replay.json
          git add timeframe_replay/timeframe_historical_replay.json
          git add timeframe_replay/timeframe_ml_validation.json
          git add timeframe_replay/swing_feature_research.json
          if git diff --cached --quiet; then
            echo "Historical replay dataset is unchanged."
          else
            git commit -m "Add historical scanner ML replay dataset"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preserve replay as ML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outcome-report-historical-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outcome_reports/outcomes_historical_replay.json
            timeframe_replay/timeframe_historical_replay.json
            timeframe_replay/timeframe_ml_validation.json
            timeframe_replay/swing_feature_research.json
          if-no-files-found: warn
          retention-days: 90
