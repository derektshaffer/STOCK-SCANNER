name: Momentum Outcome Tracker

on:
  schedule:
    # Run after the full 4:00 AM-8:00 PM ET extended session is over.
    # 01:30 UTC Tue-Sat is 9:30 PM ET during EDT and 8:30 PM ET during EST,
    # reducing write races with the live Streamlit prediction tracker.
    - cron: '30 1 * * 2-6'
  push:
    branches: [main]
    paths:
      - "score_analyzer_outcomes.py"
      - "offhours_outcome_tracker.py"
      - ".github/workflows/outcome-tracker.yml"
  workflow_dispatch:
    inputs:
      date:
        description: 'Trading date to score (YYYY-MM-DD; blank = auto)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  score:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'Run Analyzer outcome smoke')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Score scanner outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTCOME_DATE: ${{ inputs.date }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          OUTCOME_MARKET_PROVIDER: "tradier"
        run: python score_outcomes.py

      - name: Score shadow opportunity outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTCOME_DATE: ${{ inputs.date }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          OUTCOME_MARKET_PROVIDER: "tradier"
        run: python score_opportunity_outcomes.py

      - name: Score Analyzer outcomes
        env:
          OUTCOME_DATE: ${{ inputs.date }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python score_analyzer_outcomes.py

      - name: Track off-hours Swing Longer-Term outcomes
        env:
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python offhours_outcome_tracker.py

      - name: Commit durable outcome history
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outcome_reports/*.json outcome_reports/*.md 2>/dev/null || true
          git add opportunity_reports/*.json opportunity_reports/*.md 2>/dev/null || true
          git add analyzer_outcomes/*.json 2>/dev/null || true
          git add offhours_outcomes/*.json offhours_outcomes/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new outcome report to commit."
          else
            git commit -m "Add momentum scanner outcome report"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preserve outcome reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outcome-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outcome_reports/*
            opportunity_reports/*
            analyzer_outcomes/*
            offhours_outcomes/*
          if-no-files-found: warn
          retention-days: 90
