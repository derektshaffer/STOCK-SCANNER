name: Momentum Outcome Tracker

on:
  schedule:
    # 21:30 UTC is after the U.S. regular-session close year-round:
    # 17:30 ET during EDT and 16:30 ET during EST. GitHub may start scheduled
    # jobs late, so scoring must not depend on the job's actual start minute.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Trading date to score (YYYY-MM-DD; blank = auto)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Score scanner outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTCOME_DATE: ${{ inputs.date }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          OUTCOME_MARKET_PROVIDER: "tradier"
        run: python score_outcomes.py

      - name: Score Analyzer outcomes
        env:
          OUTCOME_DATE: ${{ inputs.date }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python score_analyzer_outcomes.py

      - name: Commit durable outcome history
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outcome_reports/*.json outcome_reports/*.md 2>/dev/null || true
          git add analyzer_outcomes/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new outcome report to commit."
          else
            git commit -m "Add momentum scanner outcome report"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preserve outcome reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outcome-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outcome_reports/*
            analyzer_outcomes/*
          if-no-files-found: warn
          retention-days: 90
