name: Momentum Stock Scanner

on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check US market hours
        id: market_time
        shell: bash
        run: |
          NY_DAY=$(TZ=America/New_York date +%u)
          NY_HM=$(TZ=America/New_York date +%H%M)

          if [ "$NY_DAY" -gt 5 ] || [ "$NY_HM" -lt 0930 ] || [ "$NY_HM" -gt 1600 ]; then
            echo "in_market_hours=false" >> "$GITHUB_OUTPUT"
          else
            echo "in_market_hours=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run momentum scanner
        if: github.event_name == 'workflow_dispatch' || steps.market_time.outputs.in_market_hours == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python stock_scanner.py
