name: Momentum Stock Scanner

on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check US market hours
        id: market_time
        shell: bash
        run: |
          NY_DAY=$(TZ=America/New_York date +%u)
          NY_HM=$(TZ=America/New_York date +%H%M)

          if [ "$NY_DAY" -gt 5 ] || [ "$NY_HM" -lt 0930 ] || [ "$NY_HM" -gt 1600 ]; then
            echo "in_market_hours=false" >> "$GITHUB_OUTPUT"
          else
            echo "in_market_hours=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scanner v2.7 update once
        shell: bash
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path
          text = Path('.github/workflows/apply-v27-tod-volume.yml').read_text()
          match = re.search(r'data = "([A-Za-z0-9+/=]+)"', text)
          if not match:
              raise SystemExit('Could not locate embedded v2.7 patch')
          Path('/tmp/v27.patch').write_bytes(base64.b64decode(match.group(1)))
          PY
          git apply --check /tmp/v27.patch
          git apply /tmp/v27.patch
          python -m py_compile stock_scanner.py scanner_app.py
          git show HEAD^:.github/workflows/stock-scanner.yml > .github/workflows/stock-scanner.yml
          git rm .github/workflows/apply-v27-tod-volume.yml
          git config user.name "ChatGPT Scanner Updater"
          git config user.email "actions@users.noreply.github.com"
          git add stock_scanner.py scanner_app.py .github/workflows/stock-scanner.yml
          git commit -m "Update momentum scanner to v2.7 TOD volume [skip ci]"
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run momentum scanner
        if: github.event_name == 'workflow_dispatch' || steps.market_time.outputs.in_market_hours == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python stock_scanner.py

      - name: Preserve scan logs
        if: always() && (github.event_name == 'workflow_dispatch' || steps.market_time.outputs.in_market_hours == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scan_logs/*.json
            scan_logs/*.csv
          if-no-files-found: warn
          retention-days: 30
