name: Momentum Stock Scanner

on:
  schedule:
    # Durable ML/outcome collector only. The Streamlit app keeps its own
    # 2-minute scan cadence. GitHub Actions is intentionally less frequent and
    # offset from common clock boundaries to reduce schedule queue delays.
    - cron: '7,37 8-23 * * 1-5'
    - cron: '7,37 0-1 * * 2-6'
    # Redundant regular-session evidence capture. GitHub scheduled events can
    # occasionally be delayed/skipped; this offset hourly cadence adds another
    # chance to collect independent live evidence without changing the model's
    # 60-minute same-symbol de-correlation gate.
    - cron: '17 14-20 * * 1-5'
  workflow_dispatch:

permissions:
  # Shadow Analyzer samples durably merge prediction rows into analyzer_outcomes.
  contents: write
  actions: read

concurrency:
  group: momentum-stock-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check US extended market hours
        id: market_time
        shell: bash
        env:
          ALPACA_LIVE_FEED: ${{ secrets.ALPACA_LIVE_FEED }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: |
          NY_DAY=$(TZ=America/New_York date +%u)
          NY_HM=$(TZ=America/New_York date +%H%M)
          NY_DATE=$(TZ=America/New_York date +%Y-%m-%d)
          echo "market_date=$NY_DATE" >> "$GITHUB_OUTPUT"
          FEED=$(printf '%s' "${ALPACA_LIVE_FEED:-iex}" | tr '[:upper:]' '[:lower:]')

          # Tradier consolidated live data is the preferred scanner source and
          # supports the full extended-hours window. If the GitHub secret is
          # absent, preserve the existing Alpaca feed-specific fallback window.
          if [ -n "$TRADIER_ACCESS_TOKEN" ] || [ -n "$TRADIER_TOKEN" ] || [ "$FEED" = "sip" ]; then
            START_HM=0400
            END_HM=2000
          else
            START_HM=0800
            END_HM=1700
          fi

          if [ "$NY_DAY" -gt 5 ] || [ "$NY_HM" -lt "$START_HM" ] || [ "$NY_HM" -ge "$END_HM" ]; then
            echo "in_market_hours=false" >> "$GITHUB_OUTPUT"
          else
            echo "in_market_hours=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore daily Tradier discovery universe
        if: github.event_name == 'workflow_dispatch' || steps.market_time.outputs.in_market_hours == 'true'
        uses: actions/cache@v4
        with:
          path: scan_cache
          key: tradier-discovery-${{ runner.os }}-${{ steps.market_time.outputs.market_date }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner ML dependency
        if: github.event_name == 'workflow_dispatch' || steps.market_time.outputs.in_market_hours == 'true'
        run: python -m pip install --disable-pip-version-check -q "xgboost>=2.1"

      - name: Run momentum scanner
        if: github.event_name == 'workflow_dispatch' || steps.market_time.outputs.in_market_hours == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE_FEED: ${{ secrets.ALPACA_LIVE_FEED }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          SCANNER_TRADIER_DISCOVERY: "1"
          SCANNER_DISCOVERY_UNIVERSE_SIZE: "1200"
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python stock_scanner.py

      - name: Run shadow Analyzer forward sample
        if: (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 14-20 * * 1-5') && steps.market_time.outputs.in_market_hours == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE_FEED: ${{ secrets.ALPACA_LIVE_FEED }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          ANALYZER_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANALYZER_GITHUB_REPO: ${{ github.repository }}
          # Runtime evidence must never be committed to the deployed branch;
          # those commits make Streamlit Cloud redeploy the live app.
          ANALYZER_GITHUB_BRANCH: learning-journal
          ANALYZER_SHADOW_MAX_SYMBOLS: "5"
          ANALYZER_THESIS_NAMESPACE: "shadow-forward-calibration"
          ANALYZER_PREDICTION_SOURCE: "shadow_sampler"
        run: python analyzer_shadow_sampler.py

      - name: Preserve scan logs
        if: always() && (github.event_name == 'workflow_dispatch' || steps.market_time.outputs.in_market_hours == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scan_logs/*.json
            scan_logs/*.csv
            analysis_logs/*.json
          if-no-files-found: warn
          retention-days: 30
