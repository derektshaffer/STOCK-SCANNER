name: Momentum Stock Scanner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-scanner.yml'
  schedule:
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.7 time-of-day volume patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = ""
          Path('/tmp/v27.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/v27.patch
          git apply /tmp/v27.patch
          python -m py_compile stock_scanner.py scanner_app.py
          git show 2d140d9277ece3b10de7dbafe81effa5ffea3d8f:.github/workflows/stock-scanner.yml > .github/workflows/stock-scanner.yml
          git rm .github/workflows/apply-v27-tod-volume.yml
          git config user.name "ChatGPT Scanner Updater"
          git config user.email "actions@users.noreply.github.com"
          git add stock_scanner.py scanner_app.py .github/workflows/stock-scanner.yml
          git commit -m "Update momentum scanner to v2.7 TOD volume [skip ci]"
          git push origin HEAD:main
