name: Apply Single Stock live-price fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-live-price-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply analyzer live-price patch
