        st.session_state["_auto_refresh_last_rerun"]=now_ts
        return
    if now_ts-float(last) >= max(1, AUTO_REFRESH_SECONDS-0.75):
        st.session_state["_auto_refresh_last_rerun"]=now_ts
        st.rerun(scope="app")

_auto_refresh_driver()

