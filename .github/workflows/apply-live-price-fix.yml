name: Apply Single Stock live-price fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-live-price-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply analyzer live-price fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("analyzer_app.py")
          app = app_path.read_text()

          app = replace_once(
              app,
              'import html, os, subprocess, sys, json, urllib.request, urllib.error\nfrom datetime import datetime\n',
              'import html, os, subprocess, sys, json, urllib.request, urllib.error, time\nfrom datetime import datetime, timezone\n',
              'app imports',
          )

          marker = 'from stock_analyzer import analyze\n\n'
          helpers = '''from stock_analyzer import analyze

AUTO_REFRESH_SECONDS = max(5, int(os.environ.get("ANALYZER_REFRESH_SECONDS", "15") or 15))

def _result_age_seconds(result):
    if not result or not result.get("as_of"):
        return None
    try:
        dt=datetime.fromisoformat(str(result["as_of"]))
        if dt.tzinfo is None:
            dt=dt.replace(tzinfo=timezone.utc)
        return max(0.0, (datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds())
    except Exception:
        return None

def _age_text(seconds):
    if seconds is None:
        return "time unavailable"
    seconds=float(seconds)
    if seconds < 2:
        return "just now"
    if seconds < 60:
        return f"{seconds:.0f}s ago"
    minutes=seconds/60
    if minutes < 60:
        return f"{minutes:.1f}m ago"
    return f"{minutes/60:.1f}h ago"

'''
          app = replace_once(app, marker, helpers, 'app refresh helpers')

          old_refresh = '''with c3:
    st.caption("Live feed is controlled by `ALPACA_LIVE_FEED` (IEX now; SIP after upgrade).")

if run or "result" not in st.session_state or st.session_state.get("ticker")!=ticker:
'''
          new_refresh = '''with c3:
    st.toggle("Auto-refresh", value=True, key="auto_refresh_enabled")
