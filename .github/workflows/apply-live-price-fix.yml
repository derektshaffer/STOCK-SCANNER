name: Apply Single Stock live-price fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-live-price-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply analyzer live-price fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/live-price.patch
          echo '' | base64 -d >> /tmp/live-price.patch
          git apply --check /tmp/live-price.patch
          git apply /tmp/live-price.patch
          python -m py_compile analyzer_app.py stock_analyzer.py
          rm -f .github/workflows/apply-live-price-fix.yml
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add analyzer_app.py stock_analyzer.py .github/workflows/apply-live-price-fix.yml
          git commit -m 'Fix stale Single Stock Analyzer prices'
          git push origin HEAD:main
