name: Apply Historical Pattern Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-historical-pattern-upgrade.yml'

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply historical pattern integration
        run: |
          python tools/apply_historical_patterns_patch.py
          python -m py_compile analyzer_app.py stock_analyzer.py historical_patterns.py
          rm -f tools/apply_historical_patterns_patch.py .github/workflows/apply-historical-pattern-upgrade.yml
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add analyzer_app.py stock_analyzer.py historical_patterns.py tools/apply_historical_patterns_patch.py .github/workflows/apply-historical-pattern-upgrade.yml
          git commit -m 'Integrate setup-specific historical pattern analysis'
          git push origin HEAD:main
