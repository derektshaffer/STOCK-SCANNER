name: Apply Historical Pattern Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-historical-pattern-upgrade.yml'

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade historical pattern analysis
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/apply_upgrade.py').write_bytes(base64.b64decode(' '))
          PY
          python /tmp/apply_upgrade.py
          python -m py_compile analyzer_app.py stock_analyzer.py
          rm -f .github/workflows/apply-historical-pattern-upgrade.yml
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add analyzer_app.py stock_analyzer.py .github/workflows/apply-historical-pattern-upgrade.yml
          git commit -m 'Add setup-specific historical pattern analysis'
          git push origin HEAD:main
