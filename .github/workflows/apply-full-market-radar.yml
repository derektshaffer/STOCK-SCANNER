name: Apply Full-Market Radar Patch

on:
  push:
    branches:
      - codex/full-market-explosive-radar-20260902
    paths:
      - codex-full-market.patch.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply implementation patch
        shell: bash
        run: |
          cat codex-full-market.patch.part.* > /tmp/full-market.patch.gz.b64
          echo "acb8809b07fdb9d0f5644a8d1c30109782891c76e6e293db92c439f779cfa1ac  /tmp/full-market.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/full-market.patch.gz.b64 > /tmp/full-market.patch.gz
          gzip --decompress --stdout /tmp/full-market.patch.gz > /tmp/full-market.patch
          echo "5130bca9da0dc107fb7d296a9dcfe39900c443518411777a5ff249e19bcbdfd9  /tmp/full-market.patch" | sha256sum --check
          git apply --check /tmp/full-market.patch
          git apply --index /tmp/full-market.patch
          rm -f codex-full-market.patch.ready codex-full-market.patch.part.*
          rm -f .github/workflows/apply-full-market-radar.yml
          git add -A

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Validate full-market radar
        env:
          TRADIER_ACCESS_TOKEN: offline-test-token
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scanner_discovery.py stock_scanner.py tradier_live.py scanner_runtime.py scanner_app.py scanner_expand.py app.py full_market_radar_regression_check.py
          python full_market_radar_regression_check.py
          python app_boundary_check.py
          python learning_system_regression_check.py
          python historical_hypothesis_regression_check.py
          python offhours_outcome_regression_check.py

          # consistency_regression_check.py contains a deliberately tight
          # nonblocking latency assertion. Hosted-runner scheduling jitter can
          # occasionally push it over the threshold even when the scanner code
          # is unchanged. Require a clean pass, but allow two additional fresh
          # attempts before treating it as a real regression.
          consistency_ok=0
          for attempt in 1 2 3; do
            echo "Consistency regression attempt ${attempt}/3"
            if python consistency_regression_check.py; then
              consistency_ok=1
              break
            fi
          done
          if [ "$consistency_ok" -ne 1 ]; then
            echo "Consistency regressions failed on all attempts."
            exit 1
          fi

          git diff --check --cached

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add full-market explosive radar and sub-dollar coverage"
          git push origin HEAD:codex/full-market-explosive-radar-20260902
