name: Apply Historical Setup UI Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-historical-ui-integration.yml'

permissions:
  contents: write

jobs:
  apply-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch analyzer entrypoint
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
          python -m py_compile analyzer_app.py historical_integration.py historical_ui.py historical_patterns.py
          rm -f .github/workflows/apply-historical-ui-integration.yml
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add analyzer_app.py .github/workflows/apply-historical-ui-integration.yml
          git commit -m 'Show historical setup match in analyzer UI'
          git push origin HEAD:main
